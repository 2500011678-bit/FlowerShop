<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Đăng nhập tài khoản Flower Shop"
    >

    <title>Đăng nhập | Flower Shop</title>

    <!-- =====================================================
         GOOGLE FONT
    ====================================================== -->
    <link
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- =====================================================
         ICON
    ====================================================== -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- =====================================================
         CSS CHUNG
    ====================================================== -->
    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- =====================================================
         CSS RIÊNG TRANG ĐĂNG NHẬP
    ====================================================== -->
    <style>

        /* =================================================
           RESET RIÊNG
        ================================================= */

        .login-page {
            min-height: 100vh;

            display: flex;
            flex-direction: column;

            background:
                linear-gradient(
                    135deg,
                    #fff8fb 0%,
                    #fff0f5 50%,
                    #fff8f3 100%
                );

            font-family:
                "Be Vietnam Pro",
                sans-serif;
        }


        /* =================================================
           HEADER
        ================================================= */

        .login-page header {
            width: 100%;

            min-height: 92px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 12px 7%;

            background:
                rgba(255, 248, 251, 0.97);

            border-bottom:
                1px solid
                rgba(232, 93, 139, 0.12);

            box-shadow:
                0 3px 18px
                rgba(100, 45, 65, 0.07);

            position: sticky;
            top: 0;
            z-index: 999;
        }


        /* =================================================
           LOGO
        ================================================= */

        .login-page .login-logo {
            display: flex;
            align-items: center;

            gap: 10px;

            text-decoration: none;

            flex-shrink: 0;
        }

        .login-page .login-logo img {
            width: 56px;
            height: 56px;

            object-fit: contain;
        }

        .login-page .login-logo span {
            font-family:
                "Be Vietnam Pro",
                sans-serif;

            font-size: 30px;

            font-weight: 800;

            line-height: 1;

            white-space: nowrap;

            background:
                linear-gradient(
                    90deg,
                    #ff6f9f,
                    #ff7fa8,
                    #ffb36b
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            background-clip: text;
        }


        /* =================================================
           HEADER NAV
        ================================================= */

        .login-page .login-nav {
            display: flex;
            align-items: center;
        }

        .login-page .login-nav a {
            position: relative;

            display: inline-block;

            padding: 10px 0;

            margin-left: 28px;

            color: #4a3b40;

            font-size: 15px;

            font-weight: 600;

            text-decoration: none;

            transition:
                color 0.25s ease;
        }

        .login-page .login-nav a:hover {
            color: #e85d8b;
        }


        /* =================================================
           MAIN
        ================================================= */

        .login-main {
            flex: 1;

            display: flex;

            align-items: center;
            justify-content: center;

            padding:
                60px 20px 80px;
        }


        /* =================================================
           LOGIN CONTAINER
        ================================================= */

        .login-container {
            width: 100%;

            max-width: 460px;
        }


        /* =================================================
           LOGIN CARD
        ================================================= */

        .login-card {
            width: 100%;

            padding:
                42px 40px;

            background:
                rgba(255, 255, 255, 0.96);

            border:
                1px solid
                rgba(232, 93, 139, 0.13);

            border-radius: 24px;

            box-shadow:
                0 20px 55px
                rgba(130, 65, 85, 0.12);

            backdrop-filter: blur(10px);

            animation:
                loginFade 0.6s ease;
        }


        /* =================================================
           LOGIN TITLE
        ================================================= */

        .login-icon {
            width: 72px;
            height: 72px;

            margin:
                0 auto 20px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #ffe0eb,
                    #fff0f5
                );

            color: #e85d8b;

            font-size: 28px;

            box-shadow:
                0 10px 25px
                rgba(232, 93, 139, 0.12);
        }

        .login-card h1 {
            margin: 0;

            text-align: center;

            color: #4a3b40;

            font-size: 30px;

            font-weight: 800;
        }

        .login-subtitle {
            margin:
                8px 0 30px;

            text-align: center;

            color: #8a777e;

            font-size: 14px;

            line-height: 1.6;
        }


        /* =================================================
           FORM
        ================================================= */

        .login-form {
            width: 100%;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            color: #4a3b40;

            font-size: 14px;

            font-weight: 600;
        }


        /* =================================================
           INPUT
        ================================================= */

        .input-box {
            position: relative;

            width: 100%;
        }

        .input-box > i {
            position: absolute;

            left: 16px;
            top: 50%;

            transform:
                translateY(-50%);

            color: #d4869d;

            font-size: 16px;

            pointer-events: none;
        }

        .input-box input {
            width: 100%;

            height: 52px;

            padding:
                0 48px;

            border:
                1px solid
                #eadce1;

            border-radius: 14px;

            outline: none;

            background: #fff;

            color: #4a3b40;

            font-family:
                "Be Vietnam Pro",
                sans-serif;

            font-size: 14px;

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }

        .input-box input::placeholder {
            color: #b5a5ab;
        }

        .input-box input:focus {
            border-color: #ff8eae;

            background: #fffafd;

            box-shadow:
                0 0 0 4px
                rgba(255, 111, 159, 0.10);
        }


        /* =================================================
           SHOW PASSWORD
        ================================================= */

        .toggle-password {
            position: absolute;

            right: 16px;
            top: 50%;

            transform:
                translateY(-50%);

            border: none;

            background: transparent;

            color: #a9969d;

            cursor: pointer;

            font-size: 15px;

            padding: 3px;
        }

        .toggle-password:hover {
            color: #e85d8b;
        }


        /* =================================================
           OPTIONS
        ================================================= */

        .login-options {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 15px;

            margin:
                2px 0 24px;
        }

        .remember {
            display: flex;

            align-items: center;

            gap: 8px;

            color: #76666c;

            font-size: 13px;

            cursor: pointer;
        }

        .remember input {
            width: 16px;
            height: 16px;

            accent-color: #e85d8b;

            cursor: pointer;
        }

        .forgot-password {
            color: #e85d8b;

            font-size: 13px;

            font-weight: 600;

            text-decoration: none;
        }

        .forgot-password:hover {
            color: #c94f78;

            text-decoration: underline;
        }


        /* =================================================
           LOGIN BUTTON
        ================================================= */

        .login-button {
            width: 100%;

            height: 52px;

            border: none;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #ff6f9f,
                    #e85d8b
                );

            color: #fff;

            font-family:
                "Be Vietnam Pro",
                sans-serif;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 10px 22px
                rgba(232, 93, 139, 0.22);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        .login-button:hover {
            transform:
                translateY(-2px);

            box-shadow:
                0 14px 28px
                rgba(232, 93, 139, 0.28);
        }

        .login-button:active {
            transform:
                translateY(0);
        }


        /* =================================================
           DIVIDER
        ================================================= */

        .login-divider {
            display: flex;

            align-items: center;

            gap: 12px;

            margin:
                28px 0 22px;

            color: #b4a4aa;

            font-size: 12px;
        }

        .login-divider::before,
        .login-divider::after {
            content: "";

            flex: 1;

            height: 1px;

            background:
                #eee2e7;
        }


        /* =================================================
           REGISTER
        ================================================= */

        .register-text {
            margin: 0;

            text-align: center;

            color: #76666c;

            font-size: 14px;
        }

        .register-text a {
            color: #e85d8b;

            font-weight: 700;

            text-decoration: none;
        }

        .register-text a:hover {
            color: #c94f78;

            text-decoration: underline;
        }


        /* =================================================
           FOOTER
        ================================================= */

        .login-footer {
            padding:
                20px;

            text-align: center;

            color: #9a878f;

            font-size: 12px;

            background:
                rgba(255, 255, 255, 0.55);

            border-top:
                1px solid
                rgba(232, 93, 139, 0.08);
        }


        /* =================================================
           ANIMATION
        ================================================= */

        @keyframes loginFade {

            from {
                opacity: 0;

                transform:
                    translateY(20px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }

        }


        /* =================================================
           TABLET
        ================================================= */

        @media (max-width: 768px) {

            .login-page header {
                padding:
                    12px 5%;
            }

            .login-page .login-logo img {
                width: 52px;
                height: 52px;
            }

            .login-page .login-logo span {
                font-size: 27px;
            }

            .login-main {
                padding:
                    45px 18px 60px;
            }

        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 600px) {

            .login-page header {
                min-height: auto;

                flex-direction: column;

                gap: 12px;

                padding:
                    14px 20px;
            }

            .login-page .login-nav {
                width: 100%;

                justify-content: center;
            }

            .login-page .login-nav a {
                margin:
                    0 10px;

                font-size: 13px;
            }

            .login-card {
                padding:
                    34px 24px;

                border-radius: 20px;
            }

            .login-card h1 {
                font-size: 26px;
            }

            .login-subtitle {
                font-size: 13px;

                margin-bottom: 25px;
            }

            .login-options {
                align-items: flex-start;

                flex-direction: column;

                gap: 12px;
            }

        }


        /* =================================================
           MOBILE NHỎ
        ================================================= */

        @media (max-width: 400px) {

            .login-page .login-logo span {
                font-size: 23px;
            }

            .login-card {
                padding:
                    30px 20px;
            }

            .login-icon {
                width: 64px;
                height: 64px;

                font-size: 24px;
            }

        }

    </style>
</head>


<body>

    <div class="login-page">


        <!-- =================================================
             HEADER
        ================================================= -->

        <header>

            <!-- LOGO -->
            <a
                href="index.html"
                class="login-logo"
                aria-label="Flower Shop - Trang chủ"
            >

                <img
                    src="images/logo.png"
                    alt="Flower Shop"
                >

                <span>Flower Shop</span>

            </a>


            <!-- MENU -->
            <nav class="login-nav">

                <a href="index.html">
                    Trang chủ
                </a>

                <a href="shop.html">
                    Shop Hoa
                </a>

                <a href="dangnhap.html">
                    Đăng nhập
                </a>

            </nav>

        </header>



        <!-- =================================================
             MAIN
        ================================================= -->

        <main class="login-main">

            <div class="login-container">

                <section class="login-card">


                    <!-- ICON -->
                    <div class="login-icon">

                        <i class="fa-solid fa-user"></i>

                    </div>


                    <!-- TITLE -->
                    <h1>
                        Đăng nhập
                    </h1>

                    <p class="login-subtitle">
                        Chào mừng bạn quay trở lại với
                        <strong>Flower Shop</strong> 🌸
                    </p>


                    <!-- FORM -->
                    <form
                        class="login-form"
                        id="loginForm"
                    >


                        <!-- EMAIL -->
                        <div class="form-group">

                            <label for="email">
                                Email
                            </label>

                            <div class="input-box">

                                <i class="fa-solid fa-envelope"></i>

                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    placeholder="Nhập email của bạn"
                                    autocomplete="email"
                                    required
                                >

                            </div>

                        </div>


                        <!-- PASSWORD -->
                        <div class="form-group">

                            <label for="password">
                                Mật khẩu
                            </label>

                            <div class="input-box">

                                <i class="fa-solid fa-lock"></i>

                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    placeholder="Nhập mật khẩu"
                                    autocomplete="current-password"
                                    required
                                >

                                <button
                                    type="button"
                                    class="toggle-password"
                                    id="togglePassword"
                                    aria-label="Hiện hoặc ẩn mật khẩu"
                                >

                                    <i class="fa-solid fa-eye"></i>

                                </button>

                            </div>

                        </div>


                        <!-- OPTIONS -->
                        <div class="login-options">

                            <label class="remember">

                                <input
                                    type="checkbox"
                                    id="remember"
                                >

                                <span>
                                    Ghi nhớ đăng nhập
                                </span>

                            </label>


                            <a
                                href="#"
                                class="forgot-password"
                                id="forgotPassword"
                            >
                                Quên mật khẩu?
                            </a>

                        </div>


                        <!-- LOGIN -->
                        <button
                            type="submit"
                            class="login-button"
                        >

                            <i class="fa-solid fa-right-to-bracket"></i>

                            Đăng nhập

                        </button>


                    </form>


                    <!-- DIVIDER -->
                    <div class="login-divider">
                        hoặc
                    </div>


                    <!-- REGISTER -->
                    <p class="register-text">

                        Chưa có tài khoản?

                        <a href="dangky.html">
                            Đăng ký ngay
                        </a>

                    </p>


                </section>

            </div>

        </main>



        <!-- =================================================
             FOOTER
        ================================================= -->

        <footer class="login-footer">

            © 2026 Flower Shop.
            Mang sắc hoa đến mọi khoảnh khắc 🌷

        </footer>


    </div>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        /* =================================================
           HIỆN / ẨN MẬT KHẨU
        ================================================= */

        const passwordInput =
            document.getElementById("password");

        const togglePassword =
            document.getElementById("togglePassword");


        togglePassword.addEventListener(
            "click",
            function () {

                const icon =
                    this.querySelector("i");

                if (
                    passwordInput.type === "password"
                ) {

                    passwordInput.type =
                        "text";

                    icon.classList.remove(
                        "fa-eye"
                    );

                    icon.classList.add(
                        "fa-eye-slash"
                    );

                } else {

                    passwordInput.type =
                        "password";

                    icon.classList.remove(
                        "fa-eye-slash"
                    );

                    icon.classList.add(
                        "fa-eye"
                    );

                }

            }
        );


        /* =================================================
           FORM ĐĂNG NHẬP
        ================================================= */

        const loginForm =
            document.getElementById("loginForm");


        loginForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("password")
                        .value
                        .trim();

                const remember =
                    document
                        .getElementById("remember")
                        .checked;


                if (!email || !password) {

                    alert(
                        "Vui lòng nhập đầy đủ email và mật khẩu."
                    );

                    return;

                }


                /*
                 * LƯU THÔNG TIN TẠM THỜI
                 *
                 * Đây là phần giao diện/demo.
                 * Khi bạn có hệ thống tài khoản thật,
                 * phần này sẽ được nối với backend/database.
                 */

                if (remember) {

                    localStorage.setItem(
                        "flowerShopEmail",
                        email
                    );

                } else {

                    localStorage.removeItem(
                        "flowerShopEmail"
                    );

                }


                alert(
                    "Đăng nhập thành công! 🌸"
                );


                /*
                 * Sau khi đăng nhập:
                 * quay về trang chủ.
                 */

                window.location.href =
                    "index.html";

            }
        );


        /* =================================================
           TỰ ĐIỀN EMAIL ĐÃ GHI NHỚ
        ================================================= */

        const savedEmail =
            localStorage.getItem(
                "flowerShopEmail"
            );


        if (savedEmail) {

            document.getElementById("email").value =
                savedEmail;

            document.getElementById("remember").checked =
                true;

        }


        /* =================================================
           QUÊN MẬT KHẨU
        ================================================= */

        document
            .getElementById("forgotPassword")
            .addEventListener(
                "click",
                function (event) {

                    event.preventDefault();

                    alert(
                        "Chức năng Quên mật khẩu sẽ được làm ở bước tiếp theo."
                    );

                }
            );

    </script>

</body>

</html>
