<section class="login">

    <div class="login-box">

        <h2>Đăng nhập</h2>

        <form>

            <input
                type="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                placeholder="Mật khẩu"
                required
            >

            <button type="submit" class="btn">
                Đăng nhập
            </button>

        </form>

        <p>
            Chưa có tài khoản?

            <a href="register.html">
                Đăng ký ngay
            </a>

        </p>

    </div>

</section>
